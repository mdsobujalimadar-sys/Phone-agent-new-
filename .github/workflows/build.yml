name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PhoneAgent.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd PhoneAgent && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-apk
          path: PhoneAgent/app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create build-${{ github.run_number }} PhoneAgent/app/build/outputs/apk/debug/app-debug.apk --title "Phone Agent build ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ github.token }}
